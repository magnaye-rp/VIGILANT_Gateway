      <!-- Behavioral Control Tab -->
      <div id="tab-behavioral-control" class="tab-content">
        <h2 style="margin-bottom: 2rem; font-size: 1.5rem; font-weight: 300;">Behavioral Control &amp; Habit Management <i class="fa-solid fa-info-circle tooltip-trigger" data-tooltip="Manage how the system analyzes pacing and encryption patterns to limit excessive consumption."></i></h2>

        <div class="card glassmorphic-card behavioral-card" style="background: var(--surface); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; padding: 2rem;">

          <form id="behavioral-form" onsubmit="saveBehavioralSettings(event)">
            <!-- Section A -->
            <div>
              <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--primary);">Network Request Velocity</h3>
              <div class="behavioral-preset-grid">
                <div class="form-group">
                  <label class="form-label">Preset Sensitivity</label>
                  <select id="behavioral-network-preset" onchange="toggleBehavioralCustom('network')">
                    <option value="Low">Low (200%)</option>
                    <option value="Medium">Medium (150%)</option>
                    <option value="High">High (110%)</option>
                    <option value="Custom">Custom</option>
                  </select>
                </div>
                <div class="form-group hidden" id="behavioral-network-custom-container">
                  <label class="form-label">Custom Value (%)</label>
                  <input type="number" id="behavioral-network-custom" min="50" max="500" placeholder="e.g. 150">
                </div>
              </div>
            </div>

            <!-- Section B -->
            <div>
              <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--primary);">Physical Scroll Telemetry Control</h3>
              <div class="behavioral-preset-grid">
                <div class="form-group">
                  <label class="form-label">Preset Sensitivity</label>
                  <select id="behavioral-scroll-preset" onchange="toggleBehavioralCustom('scroll')">
                    <option value="Low">Low (120/min)</option>
                    <option value="Medium">Medium (75/min)</option>
                    <option value="High">High (40/min)</option>
                    <option value="Custom">Custom</option>
                  </select>
                </div>
                <div class="form-group hidden" id="behavioral-scroll-custom-container">
                  <label class="form-label">Custom Value (Events/Min)</label>
                  <input type="number" id="behavioral-scroll-custom" min="1" max="500" placeholder="e.g. 75">
                </div>
              </div>
            </div>

            <!-- Section C -->
            <div class="behavioral-section">
              <h3 class="behavioral-title">SNI (Server Name Indication) Guard</h3>
              
              <div class="toggle-control-group">
                <div class="toggle-label-container">
                  <h4 class="toggle-main-label">Enable SNI Fallback Tracking</h4>
                  <p class="toggle-sub-description">
                    Allows VIGILANT to apply behavioral policies to encrypted apps (like Instagram &amp; TikTok) that block full SSL inspection.
                  </p>
                </div>
                
                <div class="switch-container">
                  <span id="sni-status-text" class="switch-status-indicator" style="color: #1A938A; font-weight: bold;">ON</span>
                  <label class="switch">
                    <input type="checkbox" id="behavioral-sni-enabled" checked onchange="updateSNIStatusIndicator(this)">
                    <span class="slider round"></span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Action Bar -->
            <div style="display: flex; justify-content: flex-end;">
              <button type="submit" class="btn-primary" id="behavioral-save-btn" style="transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; width: auto;">
                <i class="fa-solid fa-save"></i> Save Settings
              </button>
            </div>
          </form>
        </div>
      </div>
